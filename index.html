<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b18"><title>NOVA RAID｜ノヴァレイド</title><style>
*{box-sizing:border-box}body{margin:0;color:#edf3ff;background:radial-gradient(ellipse at 50% 55%,#192437,#090d17 72%);font-family:Barlow,system-ui,sans-serif}main{height:100svh;max-width:940px;margin:auto;padding:12px clamp(8px,3vw,32px);display:grid;grid-template-rows:46px minmax(0,1fr) 34px;gap:8px}header,footer{display:flex;align-items:center;justify-content:space-between}strong{font:bold italic 21px/1 monospace;letter-spacing:1px}strong i{color:#90ffd1;margin-right:8px}button{color:inherit;cursor:pointer;touch-action:manipulation}.tools button{background:#182332;border:1px solid #354252;border-radius:7px;font-weight:bold;padding:8px 12px;margin-left:6px}.tools button:disabled{opacity:.4}.cab{position:relative;border:1px solid #435069;border-radius:14px;overflow:hidden;box-shadow:0 16px 70px #0008;background:#060b19}.hud{position:absolute;inset:0 0 auto;z-index:1;display:flex;justify-content:space-around;background:#0b1120f0;border-bottom:1px solid #263347;padding:10px 4px;pointer-events:none}.hud label{display:block;color:#aab8cc;font-size:10px;letter-spacing:2px}.hud b{font:700 clamp(16px,3vw,23px) monospace;color:#afffdd}.hud div:last-child b{color:#ffb765}canvas{width:100%;height:100%;display:block;touch-action:none}.menu{position:absolute;top:60%;left:50%;transform:translate(-50%,-35%);text-align:center;width:100%;pointer-events:none}.menu[hidden]{display:none}h1{margin:0;color:#ffe8a7;font:1000 italic clamp(36px,min(10vw,10vh),86px)/1 system-ui;letter-spacing:-.055em;text-shadow:0 3px #e88c49,0 6px #803e51,0 9px 28px #000}.menu p{font-size:13px;color:#c8d5e6;margin:10px 0 16px;letter-spacing:2px}.action{pointer-events:auto;background:#a9ffd6;color:#082321;border:0;border-bottom:4px solid #408b79;border-radius:6px;font-weight:900;font-size:16px;padding:10px 32px}.action:active{translate:0 2px}footer{font-size:12px;color:#adbacc;gap:8px}footer b{color:#8ef2c4;font:700 11px monospace;letter-spacing:1px}@media(max-height:540px){main{grid-template-rows:32px minmax(0,1fr) 18px;padding:4px 12px;gap:3px}.hud{padding:2px}.hud b{font-size:15px}.menu p{margin:5px}.action{padding:5px 24px}.tools button{padding:4px 10px}}
</style><main><header><strong><i>◈</i>NOVA RAID</strong><div class="tools"><button id="sound">音 ON</button><button id="pause" disabled>一時停止</button></div></header><section class="cab"><canvas aria-label="宇宙シューティングのゲーム画面"></canvas><div class="hud"><div><label>SCORE</label><b id="points"></b></div><div><label>BEST</label><b id="best"></b></div><div><label>WAVE</label><b id="wave"></b></div><div><label>残機</label><b id="life"></b></div></div><div class="menu"><h1>NOVA RAID</h1><p id="desc">ノヴァレイド</p><button class="action" id="start">▶　ゲームスタート</button></div></section><footer><span>左右にドラッグで移動・押している間は連射</span><b>← → ＋ SPACE</b></footer></main><script>
const $=s=>document.querySelector(s), canvas=$('canvas'),g=canvas.getContext('2d');
const W=480,H=540,py=493,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shapes=[
['010000010','001000100','011222110','112121211','111333111','001111100','010000010'],
['100000001','010020010','011222110','111323111','011222110','010101010','100000001'],
['100010001','110020011','011222110','112323211','111222111','001111100','010000010'],
['000010000','000020000','000222000','010232010','012232210','112222211','122101221','100000001']];
const palettes=[['#35bbaf','#a3ffe3','#163f5e'],['#cf4885','#ffa6ce','#512e69'],['#df843d','#ffe194','#ba4074'],['#4087ba','#cfedf3','#ff8166']];
let mode='title',score=0,hi=0,level=1,lives=3,x=240,t=0,clock=0,grace=0,shotTimer=0,raidTimer=0,enemyTimer=0,target=x,pointer=null,muted=false,ac;
let fleet=[],shots=[],hostile=[],sparks=[],keys=new Set(),last=0,sx=1,sy=1,ox=0,oy=0,notice=0;
try{hi=Number(localStorage.novaRaidBest)||0}catch{}
const stars=Array.from({length:180},()=>[Math.random(),Math.random(),Math.random()]);
function hud(){ $('#points').textContent=String(score).padStart(6,'0');$('#best').textContent=String(hi).padStart(6,'0');$('#wave').textContent=String(level).padStart(2,'0');$('#life').textContent='▲'.repeat(lives)||'—'}
function tone(f,end,len,kind='square'){if(!ac||muted)return;let o=ac.createOscillator(),v=ac.createGain();o.type=kind;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(end,ac.currentTime+len);v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+len);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+len)}
function home(e){return [W/2+(e.col-3.5)*43+Math.sin(t*1.45)*24,100+e.row*31+Math.sin(t*2)*3]}
function spawn(){fleet=[];for(let row=0;row<4;row++)for(let col=0;col<8;col++){if(row===0&&(col<2||col>5))continue;let e={row,col,type:row===0?2:row===1?1:0,d:0};[e.x,e.y]=home(e);fleet.push(e)}hostile=[];shots=[];raidTimer=2;enemyTimer=1.7;notice=1.2}
function menu(title,subtitle,button){$('.menu').hidden=false;$('h1').textContent=title;$('#desc').textContent=subtitle;$('#start').textContent=button}
function resetInput(){keys.clear();pointer=null;target=x}
function start(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch{}}ac?.resume();if(mode!=='paused'){score=0;level=1;lives=3;t=0;x=W/2;grace=1.2;shotTimer=0;sparks=[];spawn();tone(280,640,.18)}mode='play';resetInput();$('.menu').hidden=true;$('#pause').disabled=false;hud()}
function pause(){if(mode==='paused'){start();return}if(mode!=='play')return;mode='paused';resetInput();menu('PAUSE','一時停止中','▶　つづける')}
$('#start').onclick=start;$('#pause').onclick=pause;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent='音 '+(muted?'OFF':'ON')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});window.onblur=()=>{if(mode==='play')pause()};
onkeydown=e=>{if(['ArrowLeft','ArrowRight','Space','KeyP','Escape'].includes(e.code)){if(e.target.tagName==='BUTTON'&&e.code==='Space'&&mode!=='play')return;e.preventDefault();if(!e.repeat&&['Escape','KeyP'].includes(e.code))pause();if(mode==='play')keys.add(e.code)}};onkeyup=e=>keys.delete(e.code);
let previousTouch=0;canvas.onpointerdown=e=>{if(mode!=='play'||pointer!==null)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);previousTouch=e.clientX;target=x};canvas.onpointermove=e=>{if(pointer===e.pointerId){target=clamp(target+(e.clientX-previousTouch)/sx,15,465);previousTouch=e.clientX}};canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(pointer===e.pointerId)pointer=null};
function burst(a,b,color){for(let i=0;i<18;i++){let angle=Math.random()*6.28,s=20+Math.random()*110;sparks.push({x:a,y:b,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s,life:.15+Math.random()*.36,color})}}
function hit(){if(grace>0)return;burst(x,py,'#ffb077');tone(170,42,.32,'sawtooth');lives--;hostile=[];grace=2;x=W/2;target=x;hud();if(!lives){mode='over';resetInput();$('#pause').disabled=true;menu('GAME OVER','スコア '+score+'　／　ウェーブ '+level,'↻　もういちど')}}
function update(dt){t+=dt;grace-=dt;notice-=dt;shotTimer-=dt;raidTimer-=dt;enemyTimer-=dt;
if(pointer!==null)x+=clamp(target-x,-550*dt,550*dt);else x=clamp(x+((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*300*dt,15,465);
if((pointer!==null||keys.has('Space'))&&shotTimer<=0){shots.push({x,y:py-16});shotTimer=.19;tone(750,240,.075)}
let resting=fleet.filter(e=>!e.d);if(raidTimer<=0&&resting.length){let e=resting[Math.floor(Math.random()*resting.length)];e.d=.001;e.ax=e.x;e.ay=e.y;e.aim=x;e.side=e.x<240?1:-1;raidTimer=Math.max(.52,2.25-level*.16)}
for(let e of fleet){let h=home(e);if(!e.d){[e.x,e.y]=h;continue}e.d+=dt*(1+Math.min(level,12)*.045);let p=e.d;if(p<2.2){let k=p/2.2;e.x=e.ax+(e.aim-e.ax)*k+Math.sin(p*3.2)*e.side*46;e.y=e.ay-32*Math.sin(Math.PI*Math.min(p/.52,1))+(H+25-e.ay)*k*k}else{let k=Math.min((p-2.2)/.8,1);e.x=h[0];e.y=-24+(h[1]+24)*k;if(k===1)e.d=0}}
if(enemyTimer<=0&&fleet.length){let options=fleet.filter(e=>e.y>50&&e.y<py-60),e=options[Math.floor(Math.random()*options.length)];if(e)hostile.push({x:e.x,y:e.y,vx:clamp((x-e.x)*.36,-65,65),vy:175+Math.min(level,15)*8});enemyTimer=Math.max(.38,1.3-level*.065)}
for(let s of shots){s.y-=470*dt;let i=fleet.findIndex(e=>Math.abs(e.x-s.x)<14&&Math.abs(e.y-s.y)<12);if(i>=0){let e=fleet.splice(i,1)[0];score+=(e.type+1)*50*(e.d?2:1);if(score>hi){hi=score;try{localStorage.novaRaidBest=hi}catch{}}hud();burst(e.x,e.y,palettes[e.type][1]);tone(220,52,.12,'triangle');s.y=-50}}
shots=shots.filter(s=>s.y>0);for(let b of hostile){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-x)<9&&Math.abs(b.y-py)<10)hit()}hostile=hostile.filter(b=>b.y<H+10);if(fleet.some(e=>Math.abs(e.x-x)<18&&Math.abs(e.y-py)<14))hit();
if(mode==='play'&&!fleet.length){level++;spawn();grace=1.3;hud();tone(390,910,.22)}}
function sprite(id,a,b,scale,angle=0){g.save();g.translate(a,b);g.rotate(angle);let rows=shapes[id];rows.forEach((r,j)=>{[...r].forEach((v,i)=>{if(v!=='0'){g.fillStyle=palettes[id][+v-1];g.fillRect((i-4.5)*scale,(j-3.5)*scale,scale+.05,scale+.05)}})});g.restore()}
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;if(mode!=='paused'){clock+=dt;if(mode==='play')update(dt);else if(mode==='title'){t+=dt;fleet.forEach(e=>{[e.x,e.y]=home(e)})}sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});sparks=sparks.filter(p=>p.life>0)}
let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#070c1b';g.fillRect(0,0,w,h);for(let [a,b,z] of stars){let yy=(b*h+clock*(6+z*19))%h;g.fillStyle=z>.84?'#a4c7c9':z>.5?'#566a8c':'#2e3956';g.fillRect(a*w,yy,z>.8?2:1,z>.8?2:1)}
let top=$('.hud').offsetHeight; sx=sy=Math.min(w/W,(h-top)/(H-60));ox=(w-W*sx)/2;oy=top+(h-top-(H-60)*sy)/2-60*sy;g.translate(ox,oy);g.scale(sx,sy);
for(let e of fleet)sprite(e.type,e.x,e.y,2.95,e.d?Math.sin(e.d*3)*.48:0);
for(let b of hostile){g.fillStyle='#ff936f';g.fillRect(b.x-2,b.y-4,4,10)}for(let s of shots){g.fillStyle='#afffe3';g.fillRect(s.x-2,s.y-6,4,12)}
if(lives&&!(mode==='play'&&grace>0&&Math.floor(clock*10)%2)){g.fillStyle='#ffac67';g.fillRect(x-2,py+10,4,5+Math.sin(clock*30)*3);sprite(3,x,py,3.5)}
for(let p of sparks){g.fillStyle=p.color;g.fillRect(p.x,p.y,3,3)}if(mode==='play'&&notice>0){g.fillStyle='#a9ffd6';g.font='bold 19px monospace';g.textAlign='center';g.fillText('WAVE '+String(level).padStart(2,'0'),240,310)}requestAnimationFrame(frame)}
spawn();hud();requestAnimationFrame(frame);
</script></html>
